[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; I2C LCD library (Frank de Brabander's LiquidCrystal_I2C)
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
; NOTE: fan.cpp uses the Arduino-ESP32 2.x LEDC API
; (ledcSetup/ledcAttachPin). On core 3.x, switch to ledcAttach().
